name: Assemble hero image
on:
  push:
    paths:
      - .github/workflows/assemble-hero.yml
permissions:
  contents: write
concurrency:
  group: assemble-hero
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the hero image from verified slices
        run: |
          python3 - << 'PY'
          import hashlib
          from pathlib import Path

          def lines(name):
              return Path(name).read_text().splitlines()

          def payload(name):
              return "".join(lines(name))

          def linefix(name, pairs):
              src = lines(name)
              out = []
              found = 0
              for line in src:
                  replaced = False
                  for old, new in pairs:
                      if line == old:
                          out.append(new)
                          found += 1
                          replaced = True
                          break
                  if not replaced:
                      out.append(line)
              if found != len(pairs):
                  raise SystemExit("linefix %s found %s" % (name, found))
              return "".join(out)

          def payfix(name, pairs):
              text = payload(name)
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit("payfix %s count %s" % (name, count))
                  text = text.replace(old, new, 1)
              return text

          src = lines("_b64_w00.txt")
          idx = next(i for i, line in enumerate(src) if "D2WECL7shee" in line)
          blank = "A" * 80
          src = src[:idx] + [blank] * 39 + src[idx:]
          repls = {
              "W2u3CPb2x+2l7kW7JJnarxkHMnUZX/8AWOqdXDN6v71F/pf8TmjQxEFovucl+tvwPpv4v/8ABt1+3B+": "W2u3CPb2x+2l7kW7JJnarxkHMnUZX/8AWOqdXDN6v71F/pf8TmjQxEFovucl+tvwPpv4v/8ABt1+3B+z",
              "zrHe+MPhD4y8P+MtMgRh9m1q28qQL0Dx3EBkUH0Zljx3xX5t/tN/s2/GD4d+PP+ET/aJ+HOo+E9QluDD": "rHe+MPhD4y8P+MtMgRh9m1q28qQL0Dx3EBkUH0Zljx3xX5t/tN/s2/GD4d+PP+ET/aJ+HOo+E9QluDDD",
              "D4g1OLzLV3I+Xddx7o5kJ4zklRzxgiv0F+DP/AAWI+JHh+30258c6rLrE1jbxxJPd3DoNkZDIuEIHbrjJ": "4g1OLzLV3I+Xddx7o5kJ4zklRzxgiv0F+DP/AAWI+JHh+30258c6rLrE1jbxxJPd3DoNkZDIuEIHbrjJ",
              "DA+mKZEjdSv4mv0p/wCCHf7Ov7Mfwp+IsP7Z37cUCXNt4dsJdU8C+EJrZZjfXURj2TNCfvyZkVo0cBF": "DA+mKZEjdSv4mv0p/wCCHf7Ov7Mfwp+IsP7Z37cUCXNt4dsJdU8C+EJrZZjfXURj2TNCfvyZkVo0cBFC",
              "HADvIoA57V+gnxb/AOCrOr/tR+H49A+M0sd/qFnC50bWnVVurdyP3sDuuN8LjqjZAOMdxX5z/tPfs9+": "HADvIoA57V+gnxb/AOCrOr/tR+H49A+M0sd/qFnC50bWnVVurdyP3sDuuN8LjqjZAOMdxX5z/tPfs9+G",
              "GtaE3xg+AkH2d4bkHXNCtW2iEs2FuIR/Cu44ZBwpIIwMgGIwclT9pFp90vzRnh8ZCVT2crpdG/wBSSb/": "taE3xg+AkH2d4bkHXNCtW2iEs2FuIR/Cu44ZBwpIIwMgGIwclT9pFp90vzRnh8ZCVT2crpdG/wBSSb/g",
              "gpZ+0dqn7J1j+xN431y21vwJoevJqvhqDVrMS3ugzqHVo7S4J3xQt5j7ojleTgLk58O+KUOgarBZeJtH0": "pZ+0dqn7J1j+xN431y21vwJoevJqvhqDVrMS3ugzqHVo7S4J3xQt5j7ojleTgLk58O+KUOgarBZeJtH0",
          }
          missing = [key for key in repls if key not in src]
          if missing:
              raise SystemExit("w00 missing %s" % len(missing))
          w00 = "".join(repls.get(line, line) for line in src)

          parts = [
              w00,
              payload("_b64_w01a.txt"),
              linefix("_b64_w01b.txt", [
                  ("V8Q/GnWJ3sv9vuiutQuZogpyAcosh59WWvv+JqM8JgaKq7xivO9rJX9Fp9y2SPyTgTEYXMc0xdTBv3JV", "V8Q/GnWJ3sv9fuiutQuZogpyAcosh59WWvv+JqM8JgaKq7xivO9rJX9Fp9y2SPyTgTEYXMc0xdTBv3JV"),
                  ("UDOTjmvTtIvp38D6haTMHuC0YDFMkpySMmvUhO2Ht01POlTviE+p5b8TNKs7TQ01C8t0Mykh2xhmz3+", "UDOTjmvTtIvp38D6haTMHuC0YDFMkpySMmvUhO2Ht01POlTviE+p5b8TNKs7TQ01C8t0Mykh2xhmz3+l"),
                  ("leBeLY1vILm6CFVRgu4cZ54r1r4u+OpvEdvLBOF8yNURwrgDAGOcfSvINYu92lXERJ+eRNgb644HU1wSa", "eBeLY1vILm6CFVRgu4cZ54r1r4u+OpvEdvLBOF8yNURwrgDAGOcfSvINYu92lXERJ+eRNgb644HU1wSa"),
              ]),
              linefix("_b64_w02a.txt", [
                  ("D+Nfmf8Ass+Hf2tPijpHgH4Q+JL7TZL6/isrAeH7RTenPyrHBllYkAY3NIoAHJwM11H7Snwq/4KA/", "D+Nfmf8Ass+Hf2tP2tfijpHgH4Q+JL7TZL6/isrAeH7RTenPyrHBllYkAY3NIoAHJwM11H7Snwq/4KA/"),
                  ("OgkJbS7a6vPkluhPexPCHmC+UJG2l+alSaKcLq58mftJfAT/AIZ/8W6t4F0b4raf4gufD2oz6TfXmlSM", "OgkJbS7a6vPkluhPexPCHmC+UJG2l+alSaKcLq58mftJfAT/AIZ/8W6t4F0b4raf4gufD2sz6TfXmlSM"),
              ]),
              payload("_b64_w02b.txt"),
              payfix("_b64_w03a.txt", [
                  ("3t1Nppwtxp6zB4JV9DDMSkR/IV1eqeL/ANlX4/2xP", "3t1Nppwtxp6zB4JV9DDMskR/IV1eqeL/ANlX4/2xP"),
                  ("afPqd+D8iRRMWlmmbair3JPbvivaPEXx1+C+m+KLHxLrb33je", "afPqd+D8iRRMWlmmbair3JPbivaPEXx1+C+m+KLHxLrb33je"),
                  ("F3cnaBk89a/XH/gnV/wAEIbH4BfsffEq60P4NPql+", "F3cnaBk89a/XH/gnV/wAFIbH4BfsffEq60P4NPql+"),
              ]),
              payload("_b64_w03b1.txt"),
              payload("_b64_w03b2.txt"),
              payfix("_b64_w04a.txt", [
                  ("oL+TUNSvrddFsdK02a6mvpZLjAjXadoYl", "oL+TUNSvrddFsdK06a6mvpZLjAjXadoYl"),
              ]),
              payload("_b64_w04b.txt"),
              payfix("_b64_w04c.txt", [
                  ("8r2+V9fM+UyirUvVnGXuqyqTaWn83Le/Z2uulrM5S", "8r2+V9fM+UyirUvVnGXuyqTaWn83Le/Z2uulrM5S"),
              ]),
              payfix("_b64_w04d.txt", [
                  ("/gv/AOHfD/in9ofwpovxD8GeOvCvgO18C", "/gv/AOHfD/in9ofwvovxD8GeOvCvgO18C"),
              ]),
              payload("_b64_w05a.txt"),
              payload("_b64_w05b.txt"),
              payload("_b64_w05c.txt"),
              payload("_b64_w05d.txt"),
              payload("_b64_w06a.txt"),
              payload("_b64_w06b.txt"),
              payload("_b64_w06c.txt"),
              payload("_b64_w06d.txt"),
              payload("_b64_w07a.txt"),
              payload("_b64_w07b.txt"),
              payload("_b64_w07c.txt"),
              payload("_b64_w07d.txt"),
              payload("_b64_w08a.txt"),
              payload("_b64_w08b.txt"),
              payload("_b64_w08c.txt"),
              payload("_b64_w08d.txt"),
              payload("_b64_w09a.txt"),
              payload("_b64_w09b.txt"),
          ]
          data = "".join(parts).encode()
          header = ("blob %d" % len(data)).encode() + bytes([0])
          digest = hashlib.sha1(header + data).hexdigest()
          expected = "2144f8cbf7457d94a10608fa68a66977ba851f8e"
          if len(data) != 300056 or digest != expected or data.endswith(bytes([10])):
              raise SystemExit("hero mismatch size=%s sha=%s" % (len(data), digest))
          Path("public").mkdir(exist_ok=True)
          Path("public/hero-editorial.b64").write_bytes(data)
          PY
          git rm -f _probe_c00.txt
          git rm -f _probe_mid.txt
          git rm -f _probe_mid2.txt
          git rm -f _probe_mid3.txt
          git rm -f _probe_mid4.txt
          git rm -f _probe_mid5.txt
          git rm -f _probe_mid6.txt
          git rm -f _probe_mid7.txt
          git rm -f _probe_mid8.txt
          git rm -f _probe_mid9.txt
          git rm -f _probe_mid10.txt
          git rm -f _probe_mid11.txt
          git rm -f _probe_mid12.txt
          git rm -f _b64_w00.txt
          git rm -f _b64_w01a.txt
          git rm -f _b64_w01b.txt
          git rm -f _b64_w02a.txt
          git rm -f _b64_w02b.txt
          git rm -f _b64_w03a.txt
          git rm -f _b64_w03b1.txt
          git rm -f _b64_w03b2.txt
          git rm -f _b64_w04a.txt
          git rm -f _b64_w04b.txt
          git rm -f _b64_w04c.txt
          git rm -f _b64_w04d.txt
          git rm -f _b64_w05a.txt
          git rm -f _b64_w05b.txt
          git rm -f _b64_w05c.txt
          git rm -f _b64_w05d.txt
          git rm -f _b64_w06a.txt
          git rm -f _b64_w06b.txt
          git rm -f _b64_w06c.txt
          git rm -f _b64_w06d.txt
          git rm -f _b64_w07a.txt
          git rm -f _b64_w07b.txt
          git rm -f _b64_w07c.txt
          git rm -f _b64_w07d.txt
          git rm -f _b64_w08a.txt
          git rm -f _b64_w08b.txt
          git rm -f _b64_w08c.txt
          git rm -f _b64_w08d.txt
          git rm -f _b64_w09a.txt
          git rm -f _b64_w09b.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-editorial.b64
          if git diff --cached --quiet; then
            echo "hero already matches"
            exit 0
          fi
          git commit -m "Add the hero image as base64"
          git push origin HEAD:main
